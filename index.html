<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NestPOD PANORAMA A40 — Saint-Cyprien-de-Napierville | Visite Privée</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d0d0b; color: #f7f7f7; overflow-x: hidden; }

        nav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; background: rgba(13,13,11,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(29,158,117,0.08); }
        .nav-logo { font-size: 24px; font-weight: 600; letter-spacing: 3px; }

        .carousel-section { padding-top: 72px; min-height: 100vh; }
        .carousel-container { max-width: 1400px; margin: 80px auto 60px; padding: 0 40px; }
        .carousel-title { font-size: 2.8em; font-weight: 300; letter-spacing: 2px; margin-bottom: 15px; text-align: center; }
        .carousel-subtitle { font-size: 1.1em; color: #8a8a80; text-align: center; margin-bottom: 60px; font-weight: 300; }

        .carousel-wrapper { background: #141412; border-radius: 3px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }

        .carousel-main { position: relative; width: 100%; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
        .carousel-image { width: 100%; height: 100%; object-fit: cover; display: none; }
        .carousel-image.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .carousel-counter { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 10px 16px; border-radius: 2px; font-size: 12px; font-weight: 600; }
        .carousel-controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
        .carousel-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #f7f7f7; padding: 11px 22px; border-radius: 2px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .carousel-btn:hover { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.4); }

        .carousel-thumbnails { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; padding: 20px; background: #0a0a0a; }
        .carousel-thumbnail { cursor: pointer; border: 2px solid transparent; opacity: 0.55; transition: all 0.3s; overflow: hidden; border-radius: 2px; aspect-ratio: 4/3; }
        .carousel-thumbnail img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-thumbnail.active { border-color: #f7f7f7; opacity: 1; }
        .carousel-thumbnail:hover { opacity: 0.75; }

        .carousel-info { padding: 35px; background: #141412; text-align: center; }
        .carousel-info h3 { font-size: 1.4em; margin-bottom: 12px; font-weight: 400; letter-spacing: 1px; }
        .carousel-info p { color: #8a8a80; font-size: 0.98em; line-height: 1.7; }

        @media (max-width: 768px) {
            .carousel-container { padding: 0 20px; margin: 40px auto; }
            .carousel-title { font-size: 1.8em; }
            .carousel-thumbnails { grid-template-columns: repeat(3, 1fr); }
            .carousel-controls { flex-wrap: wrap; width: 90%; justify-content: center; }
            .carousel-btn { flex: 1; min-width: 100px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo">N NestPOD</div>
    <div style="color: #8a8a80; font-size: 11px; letter-spacing: 2px;">LUXURY SMART • ELEVATED LIVING • TURNKEY HOMES</div>
</nav>

<section class="carousel-section">
    <div class="carousel-container">
        <h1 class="carousel-title">Découvrez le Panorama A40</h1>
        <p class="carousel-subtitle">Du concept à la livraison — voici l'histoire du Panorama A40 à Napierville</p>

        <div class="carousel-wrapper">
            <div class="carousel-main" id="carouselMain">
                <img src="/images/models/panorama/roof-detail-skylight-1920w.webp" alt="Concept d'implantation" class="carousel-image active" data-title="Concept d'implantation" data-desc="Vision A40 sur garage en béton avec terrasse — une solution innovante pour maximiser l'espace">
                <img src="/images/models/panorama/delivery-transport-truck-1920w.webp" alt="Livraison & Installation" class="carousel-image" data-title="Livraison & Installation" data-desc="Transport et mise en place du Panorama A40 — 9 tonnes de qualité premium livrées clé en main">
                <img src="/images/models/panorama/exterior-forest-day-1920w.webp" alt="Campagne marketing" class="carousel-image" data-title="Campagne marketing" data-desc="Maison modèle Napierville — découvrez les détails, le plan d'étage et réservez votre visite">
                <img src="/images/models/panorama/roof-detail-skylight-1920w.webp" alt="Résultat final" class="carousel-image" data-title="Résultat final" data-desc="Le Panorama A40 installé et prêt à être visité à Saint-Cyprien-de-Napierville">
                <img src="/images/models/panorama/exterior-forest-day-1920w.webp" alt="Extérieur jour" class="carousel-image" data-title="Extérieur jour" data-desc="Vue extérieure du Panorama A40 en journée avec intégration paysagère naturelle">
                <img src="/images/models/panorama/delivery-transport-truck-1920w.webp" alt="Intérieur luxe" class="carousel-image" data-title="Intérieur luxe" data-desc="Espace intérieur premium du Panorama A40 avec finitions de luxe et confort maximum">
                <img src="/images/models/panorama/roof-detail-skylight-1920w.webp" alt="Forêt intégration" class="carousel-image" data-title="Forêt intégration" data-desc="Panorama A40 intégré harmonieusement dans son environnement forestier">
                <img src="/images/models/panorama/exterior-forest-day-1920w.webp" alt="Rivière vue" class="carousel-image" data-title="Rivière vue" data-desc="Vue panoramique depuis le Panorama A40 avec perspective sur la rivière et montagnes">
                <img src="/images/models/panorama/delivery-transport-truck-1920w.webp" alt="Coucher soleil" class="carousel-image" data-title="Coucher soleil" data-desc="Panorama A40 au coucher du soleil, capture la beauté majestueuse du site à l'heure dorée">

                <div class="carousel-counter"><span id="current">1</span> / <span id="total">9</span></div>
                <div class="carousel-controls">
                    <button class="carousel-btn" onclick="prevSlide()">← Précédent</button>
                    <button class="carousel-btn" onclick="nextSlide()">Suivant →</button>
                </div>
            </div>

            <div class="carousel-thumbnails" id="thumbs"></div>

            <div class="carousel-info">
                <h3 id="title">Concept d'implantation</h3>
                <p id="desc">Vision A40 sur garage en béton avec terrasse — une solution innovante pour maximiser l'espace</p>
            </div>
        </div>
    </div>
</section>

<script>
let idx = 0;
const imgs = document.querySelectorAll('.carousel-image');
const total = imgs.length;
document.getElementById('total').textContent = total;

// Create thumbnails
const thumbsDiv = document.getElementById('thumbs');
imgs.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'carousel-thumbnail' + (i === 0 ? ' active' : '');
    div.innerHTML = `<img src="${img.src}" alt="${img.alt}">`;
    div.onclick = () => goTo(i);
    thumbsDiv.appendChild(div);
});

function update() {
    imgs.forEach((img, i) => img.classList.toggle('active', i === idx));
    document.querySelectorAll('.carousel-thumbnail').forEach((t, i) => t.classList.toggle('active', i === idx));
    document.getElementById('current').textContent = idx + 1;
    document.getElementById('title').textContent = imgs[idx].dataset.title;
    document.getElementById('desc').textContent = imgs[idx].dataset.desc;
}

function nextSlide() { idx = (idx + 1) % total; update(); }
function prevSlide() { idx = (idx - 1 + total) % total; update(); }
function goTo(i) { idx = i; update(); }

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
});

setInterval(nextSlide, 5000);
</script>

</body>
</html>
